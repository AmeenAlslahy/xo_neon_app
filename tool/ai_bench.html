<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>XO AI benchmark (dart2js)</title>
</head>
<body>
  <pre id="out">running...</pre>
  <script>
    // dart2js maps print() to console.log; mirror it into the DOM so
    // headless Chrome can be read back with --dump-dom.
    window.__benchLines = [];
    var originalLog = console.log;
    console.log = function () {
      var line = Array.prototype.join.call(arguments, ' ');
      window.__benchLines.push(line);
      document.getElementById('out').textContent = window.__benchLines.join('\n');
      originalLog.apply(console, arguments);
    };
  </script>
  <script src="build/ai_bench.js"></script>
</body>
</html>
